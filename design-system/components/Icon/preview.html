<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon</title></head>
<body>
<div id="root" style="padding:24px"></div>
<script>
var S = window.SamuraiFungi, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(96px,1fr))',gap:'16px 8px',color:'var(--ink)'}},
  S.Icon.names.map(function(n){return h('div',{key:n,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:6}},h(S.Icon,{name:n,size:32}),h('span',{className:'caption',style:{color:'var(--ink-muted)'}},n));})));
</script>
</body>
</html>
